
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#202626">
<title>China Trip</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  min-height: 100vh;
  font-family: 'Nunito', sans-serif;
  color: white;
  background: #252b2b;
  position: relative;
  padding-bottom: 35px;
}

/* BACKGROUND */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    url("https://images.unsplash.com/photo-1513407030348-c983a97b98d8?auto=format&fit=crop&w=2000&q=85")
    center center / cover no-repeat;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: rgba(18, 25, 28, 0.76);
}

/* MAIN HEADING */

.welcome {
  text-align: center;
  padding: 85px 20px 35px;
}

.welcome-label {
  color: #f0c778;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
}

.welcome h1 {
  font-size: clamp(43px, 6vw, 65px);
  font-weight: 900;
  line-height: 1.15;
  margin-top: 15px;
}

.welcome p {
  font-size: 14px;
  line-height: 1.8;
  color: rgba(255,255,255,.78);
  margin-top: 12px;
}

/* CITY CARDS */

.plans {
  max-width: 760px;
  margin: 15px auto 0;
  padding: 0 20px;
}

.city-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
}

.city-card {
  background: white;
  color: #252b29;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
  transition: transform .25s;
}

.city-card:hover {
  transform: translateY(-4px);
}

.city-image {
  height: 175px;
  position: relative;
  overflow: hidden;
  background: #53646a;
}

.city-image img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .35s;
}

.city-card:hover .city-image img {
  transform: scale(1.04);
}

.city-number {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(20,35,35,.8);
  color: white;
  padding: 5px 9px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 900;
}

.city-details {
  padding: 14px 16px;
}

.city-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.city-top h2 {
  font-size: 19px;
  font-weight: 900;
}

.city-days {
  font-size: 11px;
  color: #727a75;
  margin-top: 3px;
}

.view-btn {
  text-decoration: none;
  color: #416d50;
  font-size: 19px;
  font-weight: 800;
  padding: 5px;
  flex-shrink: 0;
}

.shenzhen .view-btn {
  color: #3c6898;
}

.view-btn:hover {
  transform: translateX(3px);
}

/* MOBILE */

@media (max-width: 600px) {
  .welcome {
    padding: 65px 18px 28px;
  }

  .welcome h1 {
    font-size: 43px;
  }

  .welcome p {
    font-size: 13px;
  }

  .plans {
    max-width: 430px;
    padding: 0 18px;
    margin-top: 10px;
  }

  .city-grid {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .city-image {
    height: 190px;
  }

  .city-details {
    padding: 14px 16px;
  }

  .city-top h2 {
    font-size: 19px;
  }
}

@media (max-width: 350px) {
  .city-image {
    height: 160px;
  }

  .city-top h2 {
    font-size: 17px;
  }

  .city-days {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<section class="welcome">
  <div class="welcome-label">OUR NEXT ADVENTURE</div>

  <h1>China Trip</h1>

  <p>
    Tap a city to view our plan and explore the best<br>
    places to eat, visit and enjoy!
  </p>
</section>

<main class="plans">
  <div class="city-grid">

    <!-- GUANGZHOU -->

    <article class="city-card">
      <a href="index.html" aria-label="Open Guangzhou itinerary">
        <div class="city-image">
          <img
            src="https://images.unsplash.com/photo-1583248369069-9d91f1640fe6?auto=format&fit=crop&w=900&q=85"
            alt="Guangzhou city"
            onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=900&q=80';"
          >
          <span class="city-number">01</span>
        </div>
      </a>

      <div class="city-details">
        <div class="city-top">
          <div>
            <h2>Guangzhou</h2>
            <p class="city-days">3 Days · Classical & Future</p>
          </div>

          <a class="view-btn" href="index.html" aria-label="View Guangzhou plan">→</a>
        </div>
      </div>
    </article>

    <!-- SHENZHEN -->

    <article class="city-card shenzhen">
      <a href="index2.html" aria-label="Open Shenzhen itinerary">
        <div class="city-image">
          <img
            src="https://images.unsplash.com/photo-1517400508447-f8dd518b86db?auto=format&fit=crop&w=900&q=85"
            alt="Shenzhen skyline"
            onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=900&q=80';"
          >
          <span class="city-number">02</span>
        </div>
      </a>

      <div class="city-details">
        <div class="city-top">
          <div>
            <h2>Shenzhen</h2>
            <p class="city-days">2.5 Days · Tech & Coast</p>
          </div>

          <a class="view-btn" href="index2.html" aria-label="View Shenzhen plan">→</a>
        </div>
      </div>
    </article>

  </div>
</main>

</body>
</html>
