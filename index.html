
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>China Trip</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background: #182027;
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 45px 20px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image: url("https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=2000&q=85");
      background-size: cover;
      background-position: center;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(13, 19, 25, 0.76);
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: auto;
      text-align: center;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 4px;
      color: #d6c4a5;
      margin-bottom: 17px;
      font-weight: 600;
    }

    h1 {
      font-size: clamp(42px, 7vw, 66px);
      font-weight: 500;
      letter-spacing: -1.5px;
      margin-bottom: 16px;
    }

    .subtitle {
      max-width: 490px;
      margin: 0 auto 38px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 15px;
      line-height: 1.8;
    }

    .cities {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      max-width: 690px;
      margin: 0 auto;
      text-align: left;
    }

    .city-card {
      display: block;
      position: relative;
      min-width: 0;
      height: 285px;
      overflow: hidden;
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      background: #30383e;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.22);
    }

    .city-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.45s ease;
    }

    .city-card:hover img {
      transform: scale(1.06);
    }

    .city-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.88) 0%,
        rgba(0, 0, 0, 0.28) 48%,
        rgba(0, 0, 0, 0.04) 100%
      );
    }

    .city-info {
      position: absolute;
      z-index: 1;
      left: 21px;
      right: 21px;
      bottom: 20px;
    }

    .city-info h2 {
      font-size: 25px;
      font-weight: 500;
      margin-bottom: 7px;
    }

    .city-info p {
      font-size: 12px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.82);
      margin-bottom: 15px;
    }

    .view-btn {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 5px;
      color: #ffffff;
      font-size: 12px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .city-card:hover .view-btn {
      background: #ffffff;
      color: #222222;
    }

    @media (max-width: 560px) {
      body {
        padding: 38px 18px;
      }

      .eyebrow {
        font-size: 10px;
        letter-spacing: 3px;
      }

      h1 {
        font-size: 45px;
      }

      .subtitle {
        font-size: 14px;
        margin-bottom: 29px;
      }

      .cities {
        gap: 13px;
      }

      .city-card {
        height: 230px;
        border-radius: 9px;
      }

      .city-info {
        left: 12px;
        right: 12px;
        bottom: 13px;
      }

      .city-info h2 {
        font-size: 20px;
      }

      .city-info p {
        font-size: 11px;
        margin-bottom: 11px;
      }

      .view-btn {
        padding: 8px 10px;
        font-size: 11px;
      }
    }

    @media (max-width: 350px) {
      .cities {
        grid-template-columns: 1fr;
      }

      .city-card {
        height: 245px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .city-card img,
      .view-btn {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <p class="eyebrow">OUR NEXT ADVENTURE</p>

    <h1>China Trip</h1>

    <p class="subtitle">
      Tap a city to view our plan and explore the best places
      to eat, visit and enjoy!
    </p>

    <section class="cities" aria-label="Choose a city">

      <!-- Guangzhou -->
      <a class="city-card" href="guangzhou.html">
        <img
          src="https://images.unsplash.com/photo-1537531383496-f4749b8032a3?auto=format&fit=crop&w=900&q=85"
          alt="Guangzhou city skyline"
          loading="eager"
          onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=900&q=85';"
        >

        <div class="city-info">
          <h2>Guangzhou</h2>
          <p>Discover the city, food and attractions.</p>
          <span class="view-btn">View Itinerary →</span>
        </div>
      </a>

      <!-- Shenzhen -->
      <a class="city-card" href="shenzhen.html">
        <img
          src="https://images.unsplash.com/photo-1474181487882-5abf3f0ba6c2?auto=format&fit=crop&w=900&q=85"
          alt="Modern city skyline"
          loading="eager"
          onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=900&q=85';"
        >

        <div class="city-info">
          <h2>Shenzhen</h2>
          <p>Explore modern landmarks and city highlights.</p>
          <span class="view-btn">View Itinerary →</span>
        </div>
      </a>

    </section>
  </main>
</body>
</html>
